<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Weapon Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="bg-gray-100 font-sans">
    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{{url_for('index')}}" class="text-white text-2xl font-bold">Weapon Detection</a>
            <div class="space-x-4">
                <a href="{{url_for('index')}}" class="text-white hover:text-blue-200">Home</a>
                <a href="{{url_for('about')}}" class="text-white hover:text-blue-200">About</a>
                <a href="{{url_for('register')}}" class="text-white hover:text-blue-200">Register</a>
                <a href="{{url_for('login')}}" class="text-white hover:text-blue-200">Login</a>
        
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="container mx-auto py-12">
        <h1 class="text-4xl font-bold text-center mb-8 animate__animated animate__bounceIn">Register</h1>

        <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg animate__animated animate__fadeInUp">
            <form action="/register" method="POST">
                <div class="mb-4">
                    <label for="username" class="block text-lg">Username</label>
                    <input type="text" id="username" name="username" class="w-full p-2 border rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-lg">email</label>
                    <input type="email" id="email" name="email" class="w-full p-2 border rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-lg">Password</label>
                    <input type="password" id="password" name="password" class="w-full p-2 border rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label for="c_password" class="block text-lg">c_password</label>
                    <input type="password" id="c_password" name="c_password" class="w-full p-2 border rounded-lg" required>
                </div>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg w-full hover:bg-blue-700">Register</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-blue-600 text-white p-4 text-center">
        <p>&copy; 2026 Weapon Detection System. All rights reserved.</p>
    </footer>
</body>
</html>
